pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "RecentAppsTV"
include ':app'
include ':magisk', ':magisk:overlay'    // the Magisk module (root instead of Shizuku): ./gradlew :magisk:moduleZip
