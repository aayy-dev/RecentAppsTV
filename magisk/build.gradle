// The Magisk module: the release APK as a privileged system app, its permission allowlist, and the framework
// overlay that gives it the recents role. No Shizuku needed on a rooted device.
//
//   ./gradlew :magisk:moduleZip   → magisk/build/outputs/RecentAppsTV-magisk-<version>.zip
plugins {
    id 'base'
}

evaluationDependsOn(':app')
evaluationDependsOn(':magisk:overlay')

def appConfig = project(':app').android.defaultConfig

// The privapp allowlist must name every signature|privileged permission the release manifest asks for: with
// enforcement a missing one stops system_server on Android 14, a boot loop. Everything else the manifest asks for has
// to be classed here, so a new permission (the app's or a library's) fails the build until someone decides.
def allowlistFile = file('module/system/etc/permissions/privapp-permissions-recentstv.xml')
def notPrivileged = [
    'android.permission.READ_MEDIA_IMAGES', 'android.permission.READ_EXTERNAL_STORAGE',
    'android.permission.QUERY_ALL_PACKAGES',
    'android.permission.REMOVE_TASKS', 'android.permission.MANAGE_ACTIVITY_TASKS',   // recents role, granted by the overlay
    'com.websnake.recentstv.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION', 'moe.shizuku.manager.permission.API_V23',
]
tasks.register('checkPrivappAllowlist') {
    group = 'verification'
    description = 'Fails if the release manifest asks for a permission the module neither allowlists nor classes as unprivileged.'
    dependsOn ':app:processReleaseManifest'
    doLast {
        def merged = project(':app').layout.buildDirectory.file('intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml').get().asFile
        def asked = new XmlSlurper(false, false).parse(merged).'uses-permission'.collect { it.attributes()['android:name'] }
        def listed = new XmlSlurper().parse(allowlistFile).'privapp-permissions'.permission.collect { it.@name.text() }
        def unknown = asked.findAll { !(it in listed) && !(it in notPrivileged) }
        if (unknown) throw new GradleException("Release manifest asks for ${unknown}: add each to ${allowlistFile.name} if it is signature|privileged, " +
            "or to notPrivileged in magisk/build.gradle if not. A privileged permission missing from the allowlist boot-loops Android 14.")
    }
}

tasks.register('moduleZip', Zip) {
    group = 'build'
    description = 'Builds the Magisk module zip (release APK as a privileged system app).'
    dependsOn 'checkPrivappAllowlist', ':app:assembleRelease', ':magisk:overlay:assembleRelease'
    doFirst {
        // Zip's from() skips a missing file without a word: don't ship a module with no app in it
        [project(':app').layout.buildDirectory.file('outputs/apk/release/app-release.apk').get().asFile,
         project(':magisk:overlay').layout.buildDirectory.file('outputs/apk/release/overlay-release.apk').get().asFile].each {
            if (!it.exists()) throw new GradleException("${it} is missing: the module would install without it")
        }
    }

    archiveFileName = "RecentAppsTV-magisk-${appConfig.versionName}.zip"
    destinationDirectory = layout.buildDirectory.dir('outputs')
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    // Magisk runs the scripts with sh: LF line endings whatever the checkout uses
    from('module') {
        filter(org.apache.tools.ant.filters.FixCrLfFilter, eol: org.apache.tools.ant.filters.FixCrLfFilter.CrLf.newInstance('lf'))
        filesMatching('module.prop') {
            expand(version: appConfig.versionName, versionCode: appConfig.versionCode)
        }
    }
    from(project(':app').layout.buildDirectory.file('outputs/apk/release/app-release.apk')) {
        into 'system/priv-app/RecentAppsTV'
        rename { 'RecentAppsTV.apk' }
    }
    from(project(':magisk:overlay').layout.buildDirectory.file('outputs/apk/release/overlay-release.apk')) {
        into 'system/product/overlay'
        rename { 'RecentAppsTVFrameworkOverlay.apk' }
    }
}

tasks.named('assemble') { dependsOn 'moduleZip' }
